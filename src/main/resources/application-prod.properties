spring.application.name=Workforce
server.port=8080

# MySQL Database (EC2 local MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/workforce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=workforce_user
spring.datasource.password=YourStrongPassword123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

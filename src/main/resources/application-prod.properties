# ========================
# PRODUCTION CONFIGURATION
# ========================

spring.application.name=Workforce
server.port=8080

# MySQL Database
# Uses host.docker.internal because the backend runs inside a Docker container
# while MySQL runs on the EC2 host. The --add-host flag in deploy.yml maps this
# to the host's IP. For RDS, replace with the RDS endpoint.
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/workforce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Rakeshkonda21
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Timezone Configuration
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata

# CORS — Comma-separated allowed origins
# In Docker-behind-nginx setup, API calls go through nginx (same-origin),
# so CORS mainly matters for direct backend access. Add your ALB DNS below.
app.cors.allowed-origins=http://localhost:4200,http://localhost

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Attendance Settings
attendance.office-start-time=09:00
attendance.office-end-time=18:00
attendance.late-threshold-minutes=15
attendance.early-departure-threshold-minutes=30
geo-attendance.default-radius-meters=200

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=rkonda863@gmail.com
spring.mail.password=zplsqhgqsbptleua
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# OTP Settings
otp.expiry-minutes=5
otp.max-attempts=5

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Ollama AI Configuration (disable if not using on EC2)
ollama.base-url=http://localhost:11434
ollama.model=phi3
ollama.timeout=60000

# Logging (production level)
# Docker containers log to stdout by default (use `docker logs backend` to view)
logging.level.root=WARN
logging.level.org.example.workforce=INFO

# ═══════════════════════════════════════════
# WorkForce HRMS — Ansible Inventory
# ═══════════════════════════════════════════
# Update the private IPs below with your actual
# EC2 instance private IPs from the Auto Scaling Group.
# These IPs are found in: EC2 Console → Instances → Private IPv4

[webservers]
ec2-instance-1 ansible_host=PRIVATE_IP_1 ansible_user=ec2-user
ec2-instance-2 ansible_host=PRIVATE_IP_2 ansible_user=ec2-user

[webservers:vars]
ansible_ssh_private_key_file=/var/lib/jenkins/.ssh/hrms-key.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

